# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: >-
  LIVE APP (set RAE_EVAL_BASE_URL). Does the deployed app judge claims the way the local build does, and does the Gemini
  critic catch what the code rules can't? Adversarial claims must be rejected by the named rule; sound claims must be
  approved (no false rejections).

prompts:
  - '{{occurrence}}'

providers:
  - id: file://provider.py
    label: rae-challenger
    config:
      workers: 1

defaultTest:
  options:
    transform: JSON.parse(output)
  assert:
    - type: javascript
      metric: ruling
      value: |
        const want = context.vars.expect;
        if (output.verdict !== want) {
          return { pass: false, score: 0, reason: `verdict ${output.verdict}, wanted ${want}; failed: ${output.failed.join(', ') || 'none'}` };
        }
        const rule = context.vars.rule;
        if (rule && !output.failed.includes(rule)) {
          return { pass: false, score: 0, reason: `rejected, but not by ${rule}; failed: ${output.failed.join(', ')}` };
        }
        return { pass: true, score: 1, reason: rule ? `rejected by ${rule}` : 'approved' };

# The other four suites run the same code rules and pass locally (promptfooconfig.yaml). This config checks what only the
# cloud has: the Gemini critic. Every claim that passes the code rules costs one critic check, and the app allows 30 a
# visitor a day, so this set uses at most 26 (5 sound + 21 critic-only) and the provider takes a fresh visitor ID per run.
tests:
  - file://tests/attacks.yaml
  - file://tests/sound_claims.yaml
  - file://tests/needs_gemini_critic.yaml
